<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Punto de Venta - Mini Super M&H</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg: #eef2f7;
            --card: #ffffff;
            --text: #1a2c3e;
            --muted: #5a6e7c;
            --primary: #2c7da0;
            --success: #2e7d32;
            --danger: #c62828;
            --border: #dce4ec;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --header-bg: #1a2c3e;
        }
        
        .dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #3b82f6;
            --border: #334155;
            --header-bg: #0f172a;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: all 0.3s;
            height: 100vh;
            overflow: hidden;
        }
        
        .pos-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .pos-header {
            background: var(--header-bg);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: var(--shadow);
        }
        
        .logo h2 {
            color: white;
            font-size: 1.3rem;
        }
        
        .logo p {
            color: #94a3b8;
            font-size: 0.7rem;
        }
        
        .header-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn-icon {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        
        .btn-icon:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        
        .pos-main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .cart-column {
            flex: 7;
            background: var(--card);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-right: 1px solid var(--border);
        }
        
        .quick-search {
            padding: 15px;
            background: var(--card);
            border-bottom: 2px solid var(--border);
        }
        
        .search-input-wrapper {
            display: flex;
            gap: 10px;
            background: var(--bg);
            border-radius: 50px;
            padding: 5px 18px;
            border: 2px solid var(--border);
            transition: all 0.2s;
        }
        
        .search-input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(44,125,160,0.2);
        }
        
        .search-input-wrapper i {
            font-size: 1.1rem;
            color: var(--muted);
            align-self: center;
        }
        
        .search-input-wrapper input {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            color: var(--text);
            outline: none;
        }
        
        .shortcut-hint {
            text-align: center;
            margin-top: 8px;
            font-size: 0.7rem;
            color: var(--muted);
        }
        
        .shortcut-hint kbd {
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            border: 1px solid var(--border);
            font-size: 0.65rem;
        }
        
        .cart-table-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        .cart-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .cart-table th {
            text-align: left;
            padding: 12px 8px;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.7rem;
            border-bottom: 2px solid var(--border);
        }
        
        .cart-table td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }
        
        .product-name-col {
            font-weight: 600;
        }
        
        .qty-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: var(--bg);
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.2s;
            margin: 0 3px;
        }
        
        .qty-btn:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
        }
        
        .quantity {
            display: inline-block;
            min-width: 35px;
            text-align: center;
            font-weight: 600;
        }
        
        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
        }
        
        .delete-btn:hover {
            transform: scale(1.1);
        }
        
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }
        
        .empty-cart i {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .payment-column {
            flex: 3;
            background: var(--card);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            overflow-y: auto;
        }
        
        .totals-card {
            background: var(--bg);
            border-radius: 16px;
            padding: 20px;
        }
        
        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        
        .grand-total {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            border-top: 2px solid var(--border);
            padding-top: 12px;
            margin-top: 8px;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        
        .action-buttons button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .btn-checkout {
            background: var(--success);
            color: white;
        }
        
        .btn-clear-cart {
            background: var(--danger);
            color: white;
        }
        
        .btn-checkout:hover, .btn-clear-cart:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeIn 0.3s ease;
        }
        
        .modal-content {
            background: var(--card);
            border-radius: 24px;
            padding: 35px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            animation: slideUp 0.3s ease;
        }
        
        .modal-content h3 {
            margin-bottom: 20px;
            color: var(--primary);
            font-size: 1.4rem;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        
        .cash-input {
            width: 100%;
            padding: 18px;
            font-size: 1.5rem;
            text-align: right;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--bg);
            color: var(--text);
            font-family: monospace;
            font-weight: bold;
        }
        
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .btn-confirm, .btn-cancel-modal {
            padding: 12px 24px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .btn-confirm {
            background: var(--success);
            color: white;
        }
        
        .btn-cancel-modal {
            background: var(--danger);
            color: white;
        }
        
        .btn-confirm:hover, .btn-cancel-modal:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        
        .modal-vuelto {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2001;
            animation: fadeIn 0.3s ease;
        }
        
        .modal-vuelto-content {
            background: var(--card);
            border-radius: 24px;
            padding: 35px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            animation: slideUp 0.3s ease;
        }
        
        .success-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }
        
        .payment-details {
            margin: 20px 0;
            padding: 20px;
            background: var(--bg);
            border-radius: 16px;
        }
        
        .payment-details p {
            margin: 10px 0;
            font-size: 1rem;
        }
        
        .change-amount {
            font-size: 1.3rem;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid var(--border);
            color: var(--success);
            font-weight: bold;
        }
        
        .btn-close-modal {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .btn-close-modal:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 2002;
            animation: slideUp 0.3s ease;
            box-shadow: var(--shadow);
            white-space: nowrap;
        }
        
        .toast-error {
            background: var(--danger);
        }
        
        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--border);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        
        @media (max-width: 768px) {
            .pos-main {
                flex-direction: column;
            }
            .cart-column {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .toast-notification {
                white-space: normal;
                text-align: center;
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
<div class="pos-container">
    <div class="pos-header">
        <div class="logo">
            <h2><i class="fas fa-store"></i> Mini Super M&H</h2>
            <p>Punto de Venta - Tickets PDF</p>
        </div>
        <div class="header-buttons">
            <button class="btn-icon" id="modoOscuroBtn"><i class="fas fa-moon"></i> Modo Oscuro</button>
            <button class="btn-icon" id="volverInventario"><i class="fas fa-boxes"></i> Inventario</button>
            <button class="btn-icon" id="volverDashboard"><i class="fas fa-chart-line"></i> Dashboard</button>
            <button class="btn-icon" id="verRegistroVentas"><i class="fas fa-receipt"></i> Registro</button>
        </div>
    </div>
    
    <div class="pos-main">
        <div class="cart-column">
            <div class="quick-search">
                <div class="search-input-wrapper">
                    <i class="fas fa-barcode"></i>
                    <input type="text" id="searchProducto" placeholder="Escanea código o busca producto..." autocomplete="off">
                </div>
                <div class="shortcut-hint">
                    <kbd>Enter</kbd> Agregar | <kbd>Supr</kbd> Eliminar | <kbd>F2</kbd> Buscar
                </div>
            </div>
            
            <div class="cart-table-container">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th style="width: 100px">CANTIDAD</th>
                            <th>PRODUCTO</th>
                            <th style="width: 80px">PRECIO</th>
                            <th style="width: 90px">SUBTOTAL</th>
                            <th style="width: 40px"></th>
                        </tr>
                    </thead>
                    <tbody id="cartTableBody">
                        <tr>
                            <td colspan="5" class="empty-cart">
                                <i class="fas fa-shopping-cart"></i>
                                <p>Carrito vacío</p>
                                <small>Escanea un producto para comenzar</small>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="payment-column">
            <div class="totals-card">
                <div class="total-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="total-row grand-total">
                    <span>TOTAL:</span>
                    <span id="total">$0.00</span>
                </div>
            </div>
            
            <div class="action-buttons">
                <button class="btn-checkout" id="finalizarVentaBtn">
                    <i class="fas fa-cash-register"></i> Cobrar
                </button>
                <button class="btn-clear-cart" id="clearCartBtn">
                    <i class="fas fa-trash"></i> Vaciar
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api';
    let productos = [];
    let carrito = [];
    
    const searchInput = document.getElementById('searchProducto');
    const cartTableBody = document.getElementById('cartTableBody');
    const subtotalSpan = document.getElementById('subtotal');
    const totalSpan = document.getElementById('total');
    const finalizarVentaBtn = document.getElementById('finalizarVentaBtn');
    const clearCartBtn = document.getElementById('clearCartBtn');
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
    }
    
    function formatMoney(n) {
        return '$' + (Number(n || 0).toFixed(2));
    }
    
    function mostrarNotificacion(mensaje, tipo = 'success') {
        const oldToast = document.querySelector('.toast-notification');
        if (oldToast) oldToast.remove();
        
        const toast = document.createElement('div');
        toast.className = `toast-notification ${tipo === 'error' ? 'toast-error' : ''}`;
        toast.innerHTML = `<i class="fas ${tipo === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> ${mensaje}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }
    
    function calcularTotal() {
        return carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
    }
    
    function actualizarTotales() {
        const total = calcularTotal();
        subtotalSpan.textContent = formatMoney(total);
        totalSpan.textContent = formatMoney(total);
    }
    
    function renderCarrito() {
        if (carrito.length === 0) {
            cartTableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty-cart">
                        <i class="fas fa-shopping-cart"></i>
                        <p>Carrito vacío</p>
                        <small>Escanea un producto para comenzar</small>
                    </td>
                </tr>
            `;
            return;
        }
        
        cartTableBody.innerHTML = carrito.map((item, index) => `
            <tr>
                <td>
                    <button class="qty-btn" onclick="cambiarCantidad(${index}, -1)">-</button>
                    <span class="quantity">${item.cantidad}</span>
                    <button class="qty-btn" onclick="cambiarCantidad(${index}, 1)">+</button>
                </td>
                <td class="product-name-col">
                    <strong>${escapeHtml(item.nombre)}</strong><br>
                    <small style="color: var(--muted);">Código: ${escapeHtml(item.codigo_barras)}</small>
                </td>
                <td>${formatMoney(item.precio)}</td>
                <td>${formatMoney(item.precio * item.cantidad)}</td>
                <td>
                    <button class="delete-btn" onclick="eliminarDelCarrito(${index})">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }
    
    function cambiarCantidad(index, delta) {
        const item = carrito[index];
        const nuevaCantidad = item.cantidad + delta;
        
        if (nuevaCantidad < 1) {
            eliminarDelCarrito(index);
        } else if (nuevaCantidad <= item.stock) {
            item.cantidad = nuevaCantidad;
            renderCarrito();
            actualizarTotales();
        } else {
            mostrarNotificacion(`⚠️ Stock máximo disponible: ${item.stock}`, 'error');
        }
    }
    
    function eliminarDelCarrito(index) {
        const producto = carrito[index];
        carrito.splice(index, 1);
        renderCarrito();
        actualizarTotales();
        mostrarNotificacion(`✗ ${producto.nombre} eliminado`);
    }
    
    function limpiarCarrito() {
        if (carrito.length > 0 && confirm('¿Vaciar todo el carrito?')) {
            carrito = [];
            renderCarrito();
            actualizarTotales();
            mostrarNotificacion('Carrito vaciado');
        }
    }
    
    async function agregarAlCarrito(producto) {
        const existente = carrito.find(item => item.id === producto.id);
        
        if (existente) {
            if (existente.cantidad < producto.stock) {
                existente.cantidad++;
                mostrarNotificacion(`+1 ${producto.nombre}`);
            } else {
                mostrarNotificacion(`⚠️ Stock máximo: ${producto.stock}`, 'error');
            }
        } else {
            if (producto.stock > 0) {
                carrito.push({
                    id: producto.id,
                    nombre: producto.nombre,
                    codigo_barras: producto.codigo_barras,
                    precio: parseFloat(producto.precio_venta),
                    cantidad: 1,
                    stock: producto.stock
                });
                mostrarNotificacion(`✓ ${producto.nombre} agregado`);
            } else {
                mostrarNotificacion(`❌ ${producto.nombre} sin stock`, 'error');
            }
        }
        
        renderCarrito();
        actualizarTotales();
        searchInput.value = '';
        searchInput.focus();
    }
    
    async function buscarYAgregarProducto() {
        const term = searchInput.value.trim().toLowerCase();
        if (!term) return;
        
        const encontrados = productos.filter(p => 
            p.codigo_barras.toLowerCase() === term || 
            p.nombre.toLowerCase() === term ||
            p.codigo_barras.toLowerCase().includes(term) ||
            p.nombre.toLowerCase().includes(term)
        );
        
        if (encontrados.length === 0) {
            mostrarNotificacion('❌ Producto no encontrado', 'error');
            searchInput.value = '';
            searchInput.focus();
            return;
        }
        
        if (encontrados.length > 1) {
            mostrarNotificacion(`🔍 ${encontrados.length} productos encontrados. Sea más específico.`, 'error');
            searchInput.focus();
            return;
        }
        
        await agregarAlCarrito(encontrados[0]);
    }
    
    // ============================================
    // GUARDAR PDF EN EL SERVIDOR
    // ============================================
    async function guardarPDFEnServidor(pdfBlob, filename) {
        try {
            const formData = new FormData();
            formData.append('pdf', pdfBlob, filename);
            
            const response = await fetch('/api/guardar-pdf', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            if (data.ok) {
                console.log('✅ PDF guardado en servidor:', data.path);
                return true;
            } else {
                console.error('Error guardando PDF:', data.error);
                return false;
            }
        } catch (error) {
            console.error('Error al guardar PDF:', error);
            return false;
        }
    }
    
    // ============================================
    // GENERAR PDF COMPLETO CON TODA LA INFORMACIÓN
    // ============================================
    async function generarTicketPDF(ventaData) {
        try {
            if (typeof window.jspdf === 'undefined') {
                mostrarNotificacion('❌ Error: Librería PDF no cargada', 'error');
                return false;
            }
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let y = 20;
            
            // === TÍTULO PRINCIPAL ===
            doc.setFontSize(22);
            doc.setTextColor(0, 0, 0);
            doc.setFont(undefined, 'bold');
            doc.text("MINI SUPER M&H", 20, y);
            y += 10;
            
            doc.setFontSize(10);
            doc.setFont(undefined, 'normal');
            doc.text("NIT: 1234-567890-123-4", 20, y);
            y += 6;
            doc.text("Tel: (123) 456-7890", 20, y);
            y += 6;
            doc.text("Dirección: Av. Principal #123, Ciudad", 20, y);
            y += 8;
            
            // === INFORMACIÓN DE LA VENTA ===
            doc.setFontSize(10);
            doc.setFont(undefined, 'bold');
            doc.text("DATOS DE LA VENTA", 20, y);
            y += 6;
            doc.setFont(undefined, 'normal');
            doc.text(`Folio: ${ventaData.folio}`, 20, y);
            y += 6;
            doc.text(`Fecha: ${new Date(ventaData.fecha).toLocaleString()}`, 20, y);
            y += 6;
            doc.text(`Atiende: ${ventaData.vendedor || 'Administrador'}`, 20, y);
            y += 6;
            doc.text(`Hora: ${new Date(ventaData.fecha).toLocaleTimeString()}`, 20, y);
            y += 10;
            
            // === LÍNEA SEPARADORA ===
            doc.line(20, y, 190, y);
            y += 7;
            
            // === ENCABEZADOS TABLA ===
            doc.setFontSize(9);
            doc.setFont(undefined, 'bold');
            doc.text("Cant", 20, y);
            doc.text("Producto", 40, y);
            doc.text("Precio", 130, y);
            doc.text("Total", 170, y);
            y += 5;
            doc.line(20, y, 190, y);
            y += 7;
            
            // === PRODUCTOS ===
            doc.setFont(undefined, 'normal');
            let totalProductos = 0;
            for (const item of ventaData.productos) {
                let nombre = item.nombre;
                if (nombre.length > 30) nombre = nombre.substring(0, 27) + '...';
                doc.text(item.cantidad.toString(), 20, y);
                doc.text(nombre, 40, y);
                doc.text(`$${item.precio.toFixed(2)}`, 130, y);
                doc.text(`$${(item.precio * item.cantidad).toFixed(2)}`, 170, y);
                y += 6;
                totalProductos += item.cantidad;
                
                if (y > 270) {
                    doc.addPage();
                    y = 20;
                }
            }
            
            // === LÍNEA SEPARADORA ===
            y += 3;
            doc.line(20, y, 190, y);
            y += 7;
            
            // === RESÚMEN DE PRODUCTOS ===
            doc.setFontSize(9);
            doc.text(`Total de productos: ${totalProductos} unidades`, 20, y);
            y += 6;
            doc.text(`Total de líneas: ${ventaData.productos.length}`, 20, y);
            y += 10;
            
            // === DETALLE DE PAGO ===
            doc.setFontSize(11);
            doc.setFont(undefined, 'bold');
            doc.text("DETALLE DE PAGO", 20, y);
            y += 7;
            
            doc.setFontSize(10);
            doc.setFont(undefined, 'normal');
            doc.text(`Subtotal: ${formatMoney(ventaData.subtotal)}`, 20, y);
            y += 6;
            doc.text(`IVA (0%): $0.00`, 20, y);
            y += 6;
            doc.line(20, y, 190, y);
            y += 6;
            
            doc.setFont(undefined, 'bold');
            doc.text(`TOTAL: ${formatMoney(ventaData.total)}`, 20, y);
            y += 10;
            
            doc.setFont(undefined, 'normal');
            doc.text(`Efectivo recibido: ${formatMoney(ventaData.cashAmount)}`, 20, y);
            y += 7;
            doc.text(`Cambio a devolver: ${formatMoney(ventaData.change)}`, 20, y);
            y += 7;
            doc.text(`Método de pago: EFECTIVO`, 20, y);
            y += 10;
            
            // === INFORMACIÓN ADICIONAL ===
            doc.setFontSize(9);
            doc.setFont(undefined, 'italic');
            doc.text(`Ticket generado: ${new Date().toLocaleString()}`, 20, y);
            y += 10;
            
            // === MENSAJE DE AGRADECIMIENTO ===
            doc.setFontSize(14);
            doc.setTextColor(0, 128, 0);
            doc.setFont(undefined, 'bold');
            doc.text("¡GRACIAS POR SU COMPRA!", 50, y);
            y += 10;
            
            doc.setFontSize(9);
            doc.setTextColor(0, 0, 0);
            doc.setFont(undefined, 'normal');
            doc.text("Conserve su ticket para cualquier reclamo", 55, y);
            y += 6;
            doc.text("Válido como factura simplificada", 60, y);
            y += 8;
            doc.text("www.minisupermyh.com", 70, y);
            y += 6;
            doc.text("¡Vuelva pronto!", 75, y);
            
            // === GUARDAR PDF ===
            const filename = `TICKET_${ventaData.folio}.pdf`;
            
            // Descargar localmente
            doc.save(filename);
            mostrarNotificacion('✅ Ticket PDF generado y descargado!');
            
            // También intentar guardar en el servidor
            const pdfBlob = doc.output('blob');
            await guardarPDFEnServidor(pdfBlob, filename);
            
            return true;
            
        } catch (error) {
            console.error('Error generando PDF:', error);
            mostrarNotificacion('❌ Error al generar PDF: ' + error.message, 'error');
            return false;
        }
    }
    
    // ============================================
    // MODAL PAGO
    // ============================================
    function mostrarModalPago(total, callback) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal-overlay';
        modalDiv.innerHTML = `
            <div class="modal-content">
                <h3>💰 Total a pagar: ${formatMoney(total)}</h3>
                <div class="form-group">
                    <label>Monto recibido del cliente:</label>
                    <input type="number" id="montoRecibido" class="cash-input" placeholder="0.00" step="0.01" autocomplete="off">
                </div>
                <div class="modal-buttons">
                    <button class="btn-cancel-modal" id="cancelarPagoBtn">Cancelar</button>
                    <button class="btn-confirm" id="confirmarPagoBtn">Calcular y Cobrar</button>
                </div>
            </div>
        `;
        document.body.appendChild(modalDiv);
        
        const input = modalDiv.querySelector('#montoRecibido');
        input.focus();
        input.select();
        
        modalDiv.querySelector('#confirmarPagoBtn').onclick = () => {
            const monto = parseFloat(input.value);
            if (isNaN(monto) || monto <= 0) {
                mostrarNotificacion('Ingrese un monto válido', 'error');
                input.focus();
                return;
            }
            if (monto < total) {
                mostrarNotificacion(`Faltan ${formatMoney(total - monto)}`, 'error');
                input.focus();
                return;
            }
            modalDiv.remove();
            callback(monto);
        };
        
        modalDiv.querySelector('#cancelarPagoBtn').onclick = () => {
            modalDiv.remove();
        };
    }
    
    // ============================================
    // MODAL VUELTO
    // ============================================
    function mostrarModalVuelto(cashAmount, total, callback) {
        const change = cashAmount - total;
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal-vuelto';
        modalDiv.innerHTML = `
            <div class="modal-vuelto-content">
                <div class="success-icon">✅</div>
                <h3>¡Venta Completada!</h3>
                <div class="payment-details">
                    <p><strong>Total de la compra:</strong> ${formatMoney(total)}</p>
                    <p><strong>Cliente pagó:</strong> ${formatMoney(cashAmount)}</p>
                    <p class="change-amount"><strong>Cambio a devolver:</strong> ${formatMoney(change)}</p>
                </div>
                <button class="btn-close-modal" id="cerrarVueltoBtn">Aceptar y Generar Ticket</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        
        modalDiv.querySelector('#cerrarVueltoBtn').onclick = () => {
            modalDiv.remove();
            if (callback) callback();
        };
    }
    
    // ============================================
    // FINALIZAR VENTA
    // ============================================
    async function finalizarVenta() {
        if (carrito.length === 0) {
            mostrarNotificacion('🛒 El carrito está vacío', 'error');
            return;
        }
        
        const total = calcularTotal();
        const subtotal = total;
        const folio = `VENTA-${Date.now()}`;
        
        mostrarModalPago(total, async (cashAmount) => {
            const change = cashAmount - total;
            
            // Guardar en base de datos
            try {
                const detalle = carrito.map(item => ({
                    id_producto: item.id,
                    cantidad: item.cantidad,
                    precio_unitario: item.precio,
                    subtotal: item.precio * item.cantidad
                }));
                
                await fetch(`${API_URL}/ventas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        folio: folio,
                        id_usuario: 2,
                        subtotal: subtotal,
                        iva: 0,
                        total: total,
                        metodo_pago: 'efectivo',
                        detalle: detalle
                    })
                });
            } catch(e) {
                console.error('Error guardando venta:', e);
            }
            
            // Mostrar modal de vuelto
            mostrarModalVuelto(cashAmount, total, async () => {
                // Generar PDF con toda la información
                await generarTicketPDF({
                    folio: folio,
                    fecha: new Date(),
                    productos: carrito.map(item => ({
                        nombre: item.nombre,
                        cantidad: item.cantidad,
                        precio: item.precio
                    })),
                    subtotal: subtotal,
                    total: total,
                    cashAmount: cashAmount,
                    change: change,
                    vendedor: localStorage.getItem('nombre_completo') || 'Administrador'
                });
                
                // Limpiar carrito
                carrito = [];
                renderCarrito();
                actualizarTotales();
                mostrarNotificacion('🎉 Venta completada exitosamente!');
            });
        });
    }
    
    // ============================================
    // CARGAR PRODUCTOS
    // ============================================
    async function cargarProductos() {
        try {
            const res = await fetch(`${API_URL}/products`);
            const data = await res.json();
            if (data.ok) {
                productos = data.data.filter(p => p.stock > 0);
                console.log(`✅ ${productos.length} productos cargados`);
            } else {
                mostrarNotificacion('Error al cargar productos', 'error');
            }
        } catch (error) {
            console.error('Error cargando productos:', error);
            mostrarNotificacion('Error de conexión con el servidor', 'error');
        }
    }
    
    // ============================================
    // EVENTOS
    // ============================================
    finalizarVentaBtn.addEventListener('click', finalizarVenta);
    clearCartBtn.addEventListener('click', limpiarCarrito);
    
    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            buscarYAgregarProducto();
        }
    });
    
    document.getElementById('volverInventario')?.addEventListener('click', () => {
        window.location.href = '/productos';
    });
    
    document.getElementById('volverDashboard')?.addEventListener('click', () => {
        window.location.href = '/dashboard';
    });
    
    document.getElementById('verRegistroVentas')?.addEventListener('click', () => {
        window.location.href = '/registro_ventas';
    });
    
    // ============================================
    // MODO OSCURO
    // ============================================
    const modoBtn = document.getElementById('modoOscuroBtn');
    function toggleModo() {
        document.body.classList.toggle('dark');
        localStorage.setItem('modoSupermercado', document.body.classList.contains('dark'));
        modoBtn.innerHTML = document.body.classList.contains('dark') ? '<i class="fas fa-sun"></i> Modo Claro' : '<i class="fas fa-moon"></i> Modo Oscuro';
    }
    
    if (localStorage.getItem('modoSupermercado') === 'true') {
        document.body.classList.add('dark');
        modoBtn.innerHTML = '<i class="fas fa-sun"></i> Modo Claro';
    }
    modoBtn.addEventListener('click', toggleModo);
    
    // ============================================
    // FUNCIONES GLOBALES
    // ============================================
    window.cambiarCantidad = cambiarCantidad;
    window.eliminarDelCarrito = eliminarDelCarrito;
    
    // ============================================
    // INICIAR
    // ============================================
    cargarProductos();
    searchInput.focus();
    
    console.log('✅ Sistema de ventas listo!');
    console.log('💡 Los tickets PDF se guardan en la carpeta /tickets del servidor');
</script>
</body>
</html>
