<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Ventas - Mini Super M&H</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #eef2f7;
            --card: #ffffff;
            --text: #1a2c3e;
            --muted: #5a6e7c;
            --primary: #2c7da0;
            --success: #2e7d32;
            --danger: #c62828;
            --warning: #f9a825;
            --info: #0288d1;
            --border: #dce4ec;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --table-header: #f8fafc;
        }

        .dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #3b82f6;
            --border: #334155;
            --table-header: #0f172a;
        }

        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); padding: 24px; transition: all 0.3s; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header-bar { background: var(--card); border-radius: 24px; padding: 20px 28px; margin-bottom: 28px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .logo h1 { font-size: 1.6rem; background: linear-gradient(135deg, var(--primary), #48cae4); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo p { font-size: 0.8rem; color: var(--muted); }
        .header-actions { display: flex; gap: 12px; }
        
        .btn { padding: 10px 20px; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: 'Poppins', sans-serif; background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-sm { padding: 6px 12px; font-size: 0.75rem; }
        .btn-success { background: var(--success); }
        .btn-info { background: var(--info); }
        .btn-warning { background: var(--warning); color: #1a2c3e; }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
        
        .filters-panel { background: var(--card); border-radius: 24px; padding: 20px 28px; margin-bottom: 28px; box-shadow: var(--shadow); }
        .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-size: 0.75rem; font-weight: 600; color: var(--muted); }
        .filter-group input, .filter-group select { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; }
        .filter-actions { display: flex; gap: 12px; justify-content: flex-end; }
        
        .table-container { background: var(--card); border-radius: 24px; overflow-x: auto; box-shadow: var(--shadow); }
        .ventas-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 900px; }
        .ventas-table th { background: var(--table-header); padding: 14px 10px; text-align: left; font-weight: 600; color: var(--primary); border: 1px solid var(--border); }
        .ventas-table td { padding: 12px 10px; vertical-align: middle; border: 1px solid var(--border); }
        .ventas-table tr:hover { background: rgba(var(--primary), 0.05); cursor: pointer; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card); border-radius: 24px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 24px; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 12px; }
        .modal-header h3 { font-size: 1.3rem; }
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 1.5rem; padding: 6px; border-radius: 8px; transition: 0.2s; color: var(--muted); }
        .icon-btn:hover { background: var(--bg); color: var(--danger); }
        
        .reporte-modal-content { max-width: 550px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--muted); }
        .form-group input, .form-group select { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; }
        .radio-group { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 5px; }
        .radio-group label { display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer; }
        .date-range { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
        
        .detalle-item { background: var(--bg); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .detalle-producto { font-weight: 600; flex: 2; }
        .detalle-cantidad { min-width: 60px; text-align: center; }
        .detalle-precio { min-width: 80px; text-align: right; }
        .detalle-subtotal { min-width: 80px; text-align: right; font-weight: 600; color: var(--primary); }
        
        .total-venta { background: var(--primary); color: white; padding: 15px; border-radius: 12px; text-align: center; margin-top: 16px; }
        .total-venta .label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .total-venta .amount { font-size: 1.8rem; font-weight: 800; }
        
        .btn-ver-pdf { background: var(--info); color: white; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.7rem; font-weight: 600; transition: all 0.2s; }
        .btn-ver-pdf:hover { background: #0277bd; transform: translateY(-2px); }
        
        .empty-state { text-align: center; padding: 60px 20px; background: var(--card); border-radius: 24px; }
        .empty-state i { font-size: 4rem; color: var(--muted); margin-bottom: 16px; }
        
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 2002;
            animation: slideUp 0.3s ease;
            box-shadow: var(--shadow);
            white-space: nowrap;
        }
        
        .toast-error {
            background: var(--danger);
        }
        
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        
        @media (max-width: 768px) { body { padding: 16px; } .ventas-table { font-size: 0.7rem; } .date-range { grid-template-columns: 1fr; } .radio-group { gap: 10px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header-bar">
        <div class="logo">
            <h1><i class="fas fa-receipt"></i> Registro de Ventas</h1>
            <p>Historial de tickets generados</p>
        </div>
        <div class="header-actions">
            <button class="btn btn-warning" id="abrirReporteBtn"><i class="fas fa-chart-line"></i> Generar Reporte</button>
            <button class="btn" id="modoOscuroBtn"><i class="fas fa-moon"></i> Modo</button>
            <button class="btn btn-outline" id="volverVentas"><i class="fas fa-cash-register"></i> Volver a Vender</button>
            <button class="btn btn-outline" id="volverDashboard"><i class="fas fa-chart-line"></i> Dashboard</button>
        </div>
    </div>

    <div class="filters-panel">
        <div class="filters-grid">
            <div class="filter-group">
                <label><i class="fas fa-calendar"></i> Fecha desde</label>
                <input type="date" id="filtroFechaDesde">
            </div>
            <div class="filter-group">
                <label><i class="fas fa-calendar"></i> Fecha hasta</label>
                <input type="date" id="filtroFechaHasta">
            </div>
            <div class="filter-group">
                <label><i class="fas fa-qrcode"></i> Folio / Búsqueda</label>
                <input type="text" id="filtroBusqueda" placeholder="Folio o producto...">
            </div>
        </div>
        <div class="filter-actions">
            <button class="btn" id="aplicarFiltrosBtn"><i class="fas fa-search"></i> Buscar</button>
            <button class="btn-outline" id="limpiarFiltrosBtn"><i class="fas fa-eraser"></i> Limpiar</button>
            <button class="btn btn-success" id="refrescarBtn"><i class="fas fa-sync-alt"></i> Refrescar</button>
        </div>
    </div>

    <div class="table-container">
        <table class="ventas-table">
            <thead>
                <tr>
                    <th>Folio</th>
                    <th>Fecha</th>
                    <th>Total</th>
                    <th>Metodo Pago</th>
                    <th>Productos</th>
                    <th>Ticket</th>
                </tr>
            </thead>
            <tbody id="ventasTableBody">
                <tr><td colspan="6" style="text-align:center">Cargando ventas...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL DETALLE VENTA -->
<div id="detalleModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-receipt"></i> Detalle de Venta</h3>
            <button class="icon-btn" id="closeModalBtn">&times;</button>
        </div>
        <div id="detalleContent"></div>
    </div>
</div>

<!-- MODAL REPORTE DE VENTAS -->
<div id="reporteModal" class="modal">
    <div class="modal-content reporte-modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-chart-line"></i> Generar Reporte de Ventas</h3>
            <button class="icon-btn" id="closeReporteModalBtn">&times;</button>
        </div>
        
        <div class="form-group">
            <label>Seleccionar periodo:</label>
            <div class="radio-group">
                <label><input type="radio" name="periodo" value="hoy" checked> Hoy</label>
                <label><input type="radio" name="periodo" value="ayer"> Ayer</label>
                <label><input type="radio" name="periodo" value="semana"> Esta semana</label>
                <label><input type="radio" name="periodo" value="mes"> Este mes</label>
                <label><input type="radio" name="periodo" value="personalizado"> Personalizado</label>
            </div>
        </div>
        
        <div id="rangoFechas" style="display: none;">
            <div class="date-range">
                <div class="form-group">
                    <label>Fecha desde:</label>
                    <input type="date" id="reporteFechaDesde">
                </div>
                <div class="form-group">
                    <label>Fecha hasta:</label>
                    <input type="date" id="reporteFechaHasta">
                </div>
            </div>
        </div>
        
        <div class="modal-buttons">
            <button class="btn-outline" id="cancelarReporteBtn">Cancelar</button>
            <button class="btn btn-success" id="generarReporteBtn"><i class="fas fa-file-pdf"></i> Generar PDF</button>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';
    let ventas = [];
    let detallesVenta = {};
    let productos = [];

    function escapeHtml(str) { if(!str) return ''; return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
    
    function formatMoney(n) {
        let numero = Number(n);
        if (isNaN(numero)) numero = 0;
        return '$' + numero.toFixed(2);
    }
    
    const formatFecha = (fecha) => {
        if (!fecha) return 'Fecha no disponible';
        try {
            return new Date(fecha).toLocaleString();
        } catch(e) {
            return fecha;
        }
    };
    
    const formatFechaCorta = (fecha) => {
        if (!fecha) return '';
        try {
            return new Date(fecha).toLocaleDateString();
        } catch(e) {
            return fecha;
        }
    };

    function mostrarNotificacion(mensaje, tipo = 'success') {
        const oldToast = document.querySelector('.toast-notification');
        if (oldToast) oldToast.remove();
        
        const toast = document.createElement('div');
        toast.className = `toast-notification ${tipo === 'error' ? 'toast-error' : ''}`;
        toast.innerHTML = `<i class="fas ${tipo === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> ${mensaje}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    async function cargarProductos() {
        try {
            const res = await fetch(`${API_URL}/products`);
            const data = await res.json();
            if (data.ok) {
                productos = data.data;
            }
        } catch (error) {
            console.error('Error cargando productos:', error);
        }
    }

    async function cargarTickets() {
        try {
            const res = await fetch(`${API_URL}/tickets`);
            const data = await res.json();
            if (data.ok) {
                ventas = data.data;
                aplicarFiltros();
            } else {
                ventas = [];
                renderTabla([]);
            }
        } catch (error) {
            console.error('Error cargando tickets:', error);
            document.getElementById('ventasTableBody').innerHTML = '<tr><td colspan="6" style="text-align:center">Error cargando ventas</td></tr>';
        }
    }

    async function cargarDetalleVenta(ventaId) {
        if (detallesVenta[ventaId]) return detallesVenta[ventaId];
        try {
            const res = await fetch(`${API_URL}/ventas/${ventaId}/detalle`);
            const data = await res.json();
            if (data.ok) {
                const detallesConGanancia = await Promise.all(data.data.map(async (item) => {
                    let precioCompra = 0;
                    const producto = productos.find(p => p.id === item.id_producto);
                    if (producto) {
                        precioCompra = parseFloat(producto.precio_compra) || 0;
                    }
                    return {
                        ...item,
                        precio_compra: precioCompra,
                        ganancia: (item.precio_unitario - precioCompra) * item.cantidad
                    };
                }));
                detallesVenta[ventaId] = detallesConGanancia;
                return detallesConGanancia;
            }
            return [];
        } catch (error) {
            console.error('Error cargando detalle:', error);
            return [];
        }
    }

    function renderTabla(ventasFiltradas) {
        const tbody = document.getElementById('ventasTableBody');
        if (ventasFiltradas.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center"><i class="fas fa-inbox"></i> No hay ventas registradas</td></tr>';
            return;
        }
        
        tbody.innerHTML = ventasFiltradas.map(venta => `
            <tr onclick="verDetalleVenta(${venta.id})" style="cursor:pointer">
                <td><code>${escapeHtml(venta.folio)}</code></td>
                <td>${formatFecha(venta.fecha_venta)}</td>
                <td><strong>${formatMoney(venta.total)}</strong></td>
                <td>${venta.metodo_pago === 'efectivo' ? 'Efectivo' : venta.metodo_pago}</td>
                <td>${venta.cantidad_productos || 0} productos</td>
                <td>
                    <button class="btn-ver-pdf" onclick="event.stopPropagation(); verPDF('${venta.folio}')">
                        <i class="fas fa-file-pdf"></i> Ver Ticket
                    </button>
                </td>
            </tr>
        `).join('');
    }

    window.verDetalleVenta = async (id) => {
        const venta = ventas.find(v => v.id === id);
        if (!venta) return;
        
        const detalle = await cargarDetalleVenta(id);
        
        const detalleHtml = `
            <div style="margin-bottom:20px;">
                <p><strong>Folio:</strong> ${escapeHtml(venta.folio)}</p>
                <p><strong>Fecha:</strong> ${formatFecha(venta.fecha_venta)}</p>
                <p><strong>Metodo de pago:</strong> ${venta.metodo_pago === 'efectivo' ? 'Efectivo' : venta.metodo_pago}</p>
            </div>
            <h4>Productos vendidos:</h4>
            ${detalle.map(item => `
                <div class="detalle-item">
                    <div class="detalle-producto">${escapeHtml(item.nombre)}</div>
                    <div class="detalle-cantidad">${item.cantidad}</div>
                    <div class="detalle-precio">${formatMoney(item.precio_unitario)}</div>
                    <div class="detalle-subtotal">${formatMoney(item.subtotal)}</div>
                </div>
            `).join('')}
            <div class="total-venta">
                <div class="label">TOTAL DE LA VENTA</div>
                <div class="amount">${formatMoney(venta.total)}</div>
            </div>
        `;
        
        document.getElementById('detalleContent').innerHTML = detalleHtml;
        document.getElementById('detalleModal').style.display = 'flex';
    };

    window.verPDF = (folio) => {
        const pdfPath = `/tickets/TICKET_${folio}.pdf`;
        window.open(pdfPath, '_blank');
    };

    // ============================================
    // FUNCIONES PARA REPORTE DE VENTAS
    // ============================================
    
    function obtenerFechasPorPeriodo() {
        const hoy = new Date();
        const ayer = new Date();
        ayer.setDate(ayer.getDate() - 1);
        
        const inicioSemana = new Date(hoy);
        inicioSemana.setDate(hoy.getDate() - hoy.getDay());
        const finSemana = new Date(inicioSemana);
        finSemana.setDate(inicioSemana.getDate() + 6);
        
        const inicioMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
        const finMes = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0);
        
        return {
            hoy: { desde: hoy, hasta: hoy },
            ayer: { desde: ayer, hasta: ayer },
            semana: { desde: inicioSemana, hasta: finSemana },
            mes: { desde: inicioMes, hasta: finMes }
        };
    }
    
    function filtrarVentasPorRango(desde, hasta) {
        const desdeDate = new Date(desde);
        desdeDate.setHours(0, 0, 0, 0);
        const hastaDate = new Date(hasta);
        hastaDate.setHours(23, 59, 59);
        
        return ventas.filter(venta => {
            const fechaVenta = new Date(venta.fecha_venta);
            return fechaVenta >= desdeDate && fechaVenta <= hastaDate;
        });
    }
    
    async function generarReportePDF() {
        const periodoSeleccionado = document.querySelector('input[name="periodo"]:checked').value;
        let desde, hasta;
        let tituloPeriodo = '';
        
        if (periodoSeleccionado === 'personalizado') {
            desde = document.getElementById('reporteFechaDesde').value;
            hasta = document.getElementById('reporteFechaHasta').value;
            
            if (!desde || !hasta) {
                mostrarNotificacion('Seleccione ambas fechas', 'error');
                return;
            }
            tituloPeriodo = formatFechaCorta(desde) + ' al ' + formatFechaCorta(hasta);
        } else {
            const fechas = obtenerFechasPorPeriodo();
            switch(periodoSeleccionado) {
                case 'hoy':
                    desde = fechas.hoy.desde;
                    hasta = fechas.hoy.hasta;
                    tituloPeriodo = formatFechaCorta(desde);
                    break;
                case 'ayer':
                    desde = fechas.ayer.desde;
                    hasta = fechas.ayer.hasta;
                    tituloPeriodo = formatFechaCorta(desde);
                    break;
                case 'semana':
                    desde = fechas.semana.desde;
                    hasta = fechas.semana.hasta;
                    tituloPeriodo = formatFechaCorta(desde) + ' al ' + formatFechaCorta(hasta);
                    break;
                case 'mes':
                    desde = fechas.mes.desde;
                    hasta = fechas.mes.hasta;
                    tituloPeriodo = formatFechaCorta(desde) + ' al ' + formatFechaCorta(hasta);
                    break;
                default:
                    desde = fechas.hoy.desde;
                    hasta = fechas.hoy.hasta;
                    tituloPeriodo = formatFechaCorta(desde);
            }
        }
        
        const ventasFiltradas = filtrarVentasPorRango(desde, hasta);
        
        if (ventasFiltradas.length === 0) {
            mostrarNotificacion('No hay ventas en el periodo seleccionado', 'error');
            return;
        }
        
        // Calcular totales
        let totalVentas = 0;
        let totalCosto = 0;
        let totalProductosVendidos = 0;
        
        for (const venta of ventasFiltradas) {
            const detalle = await cargarDetalleVenta(venta.id);
            const totalVenta = parseFloat(venta.total) || 0;
            totalVentas += totalVenta;
            
            for (const item of detalle) {
                const cantidad = parseInt(item.cantidad) || 0;
                totalProductosVendidos += cantidad;
                const precioCompra = item.precio_compra || 0;
                totalCosto += precioCompra * cantidad;
            }
        }
        
        const gananciaTotal = totalVentas - totalCosto;
        const margenGanancia = totalVentas > 0 ? (gananciaTotal / totalVentas) * 100 : 0;
        
        // Generar PDF
        try {
            if (typeof window.jspdf === 'undefined') {
                mostrarNotificacion('Error: Libreria PDF no cargada', 'error');
                return;
            }
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let y = 20;
            const fechaGeneracion = new Date().toLocaleString();
            
            // Titulo
            doc.setFontSize(20);
            doc.setTextColor(0, 0, 0);
            doc.setFont(undefined, 'bold');
            doc.text("REPORTE DE VENTAS", 20, y);
            y += 12;
            
            doc.setFontSize(10);
            doc.setFont(undefined, 'normal');
            doc.text("Mini Super M&H", 20, y);
            y += 6;
            doc.text("Tel: 7576-5972", 20, y);
            y += 6;
            doc.text("Direccion: Ciudad Paraiso 1, poligono 11 casa 3", 20, y);
            y += 5;
            doc.text("calle principal. Santa Ana, El Salvador", 20, y);
            y += 10;
            
            // Periodo
            doc.setFontSize(11);
            doc.setFont(undefined, 'bold');
            doc.text("Periodo: " + tituloPeriodo, 20, y);
            y += 7;
            
            doc.setFontSize(9);
            doc.setFont(undefined, 'italic');
            doc.text("Reporte generado: " + fechaGeneracion, 20, y);
            y += 15;
            
            // Tabla de ventas
            doc.setFontSize(11);
            doc.setFont(undefined, 'bold');
            doc.text("DETALLE DE VENTAS", 20, y);
            y += 7;
            
            // Encabezados
            doc.setFillColor(200, 200, 200);
            doc.rect(20, y, 170, 8, 'F');
            doc.setFontSize(9);
            doc.setFont(undefined, 'bold');
            doc.text("Fecha", 22, y + 5);
            doc.text("Folio", 65, y + 5);
            doc.text("Productos", 110, y + 5);
            doc.text("Total", 160, y + 5);
            y += 8;
            
            doc.setFont(undefined, 'normal');
            
            for (const venta of ventasFiltradas) {
                if (y > 200) {
                    doc.addPage();
                    y = 20;
                    doc.setFillColor(200, 200, 200);
                    doc.rect(20, y, 170, 8, 'F');
                    doc.text("Fecha", 22, y + 5);
                    doc.text("Folio", 65, y + 5);
                    doc.text("Productos", 110, y + 5);
                    doc.text("Total", 160, y + 5);
                    y += 8;
                }
                
                const cantidadItems = venta.cantidad_productos || 0;
                doc.text(formatFechaCorta(venta.fecha_venta), 22, y + 4);
                doc.text(venta.folio, 65, y + 4);
                doc.text(cantidadItems + " productos", 110, y + 4);
                doc.text(formatMoney(venta.total), 160, y + 4);
                y += 6;
            }
            
            y += 15;
            
            // Resumen final
            doc.setFillColor(44, 125, 160);
            doc.rect(20, y, 170, 55, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(12);
            doc.setFont(undefined, 'bold');
            doc.text("RESUMEN DEL PERIODO", 20, y + 8);
            
            doc.setFontSize(10);
            doc.text("Total de ventas: " + ventasFiltradas.length, 20, y + 20);
            doc.text("Total productos vendidos: " + totalProductosVendidos, 20, y + 30);
            doc.text("Monto total: " + formatMoney(totalVentas), 110, y + 20);
            doc.text("Costo total: " + formatMoney(totalCosto), 110, y + 30);
            
            doc.setFontSize(11);
            doc.setTextColor(255, 215, 0);
            doc.text("GANANCIA TOTAL: " + formatMoney(gananciaTotal), 20, y + 44);
            doc.text("Margen: " + margenGanancia.toFixed(2) + "%", 110, y + 44);
            y += 62;
            
            doc.setTextColor(0, 0, 0);
            
            // Pie de pagina
            doc.setFontSize(9);
            doc.setTextColor(100, 100, 100);
            doc.setFont(undefined, 'italic');
            doc.text("Este documento es un reporte oficial del sistema de ventas", 20, 280);
            doc.text("Reporte generado por Sistema M&H - " + fechaGeneracion, 20, 286);
            
            const filename = "REPORTE_VENTAS_" + new Date().toISOString().slice(0,10) + ".pdf";
            doc.save(filename);
            mostrarNotificacion("Reporte PDF generado correctamente");
            
        } catch (error) {
            console.error('Error generando reporte:', error);
            mostrarNotificacion('Error al generar reporte', 'error');
        }
    }
    
    // ============================================
    // EVENTOS DEL MODAL REPORTE
    // ============================================
    
    function mostrarModalReporte() {
        document.getElementById('reporteModal').style.display = 'flex';
        const hoy = new Date().toISOString().split('T')[0];
        const haceUnMes = new Date();
        haceUnMes.setMonth(haceUnMes.getMonth() - 1);
        document.getElementById('reporteFechaDesde').value = haceUnMes.toISOString().split('T')[0];
        document.getElementById('reporteFechaHasta').value = hoy;
    }
    
    function cerrarModalReporte() {
        document.getElementById('reporteModal').style.display = 'none';
    }
    
    document.querySelectorAll('input[name="periodo"]').forEach(radio => {
        radio.addEventListener('change', function() {
            const rangoDiv = document.getElementById('rangoFechas');
            rangoDiv.style.display = this.value === 'personalizado' ? 'block' : 'none';
        });
    });
    
    document.getElementById('abrirReporteBtn')?.addEventListener('click', mostrarModalReporte);
    document.getElementById('closeReporteModalBtn')?.addEventListener('click', cerrarModalReporte);
    document.getElementById('cancelarReporteBtn')?.addEventListener('click', cerrarModalReporte);
    document.getElementById('generarReporteBtn')?.addEventListener('click', async () => {
        await generarReportePDF();
        cerrarModalReporte();
    });
    
    document.getElementById('closeModalBtn')?.addEventListener('click', () => {
        document.getElementById('detalleModal').style.display = 'none';
    });
    
    document.getElementById('aplicarFiltrosBtn')?.addEventListener('click', aplicarFiltros);
    document.getElementById('limpiarFiltrosBtn')?.addEventListener('click', limpiarFiltros);
    document.getElementById('refrescarBtn')?.addEventListener('click', () => cargarTickets());
    document.getElementById('volverVentas')?.addEventListener('click', () => window.location.href = '/ventas');
    document.getElementById('volverDashboard')?.addEventListener('click', () => window.location.href = '/dashboard');
    
    window.addEventListener('click', (e) => {
        if (e.target === document.getElementById('reporteModal')) cerrarModalReporte();
        if (e.target === document.getElementById('detalleModal')) document.getElementById('detalleModal').style.display = 'none';
    });

    function aplicarFiltros() {
        let filtradas = [...ventas];
        const fechaDesde = document.getElementById('filtroFechaDesde').value;
        const fechaHasta = document.getElementById('filtroFechaHasta').value;
        const busqueda = document.getElementById('filtroBusqueda').value.toLowerCase();
        
        if (fechaDesde) {
            filtradas = filtradas.filter(v => new Date(v.fecha_venta) >= new Date(fechaDesde));
        }
        if (fechaHasta) {
            const hasta = new Date(fechaHasta);
            hasta.setHours(23, 59, 59);
            filtradas = filtradas.filter(v => new Date(v.fecha_venta) <= hasta);
        }
        if (busqueda) {
            filtradas = filtradas.filter(v => v.folio.toLowerCase().includes(busqueda));
        }
        renderTabla(filtradas);
    }

    function limpiarFiltros() {
        document.getElementById('filtroFechaDesde').value = '';
        document.getElementById('filtroFechaHasta').value = '';
        document.getElementById('filtroBusqueda').value = '';
        aplicarFiltros();
    }

    // Modo oscuro
    const modoBtn = document.getElementById('modoOscuroBtn');
    function toggleModo() {
        document.body.classList.toggle('dark');
        localStorage.setItem('modoSupermercado', document.body.classList.contains('dark'));
        modoBtn.innerHTML = document.body.classList.contains('dark') ? '<i class="fas fa-sun"></i> Claro' : '<i class="fas fa-moon"></i> Oscuro';
    }
    if (localStorage.getItem('modoSupermercado') === 'true') {
        document.body.classList.add('dark');
        modoBtn.innerHTML = '<i class="fas fa-sun"></i> Claro';
    }
    modoBtn?.addEventListener('click', toggleModo);

    // Inicializar
    async function iniciar() {
        await cargarProductos();
        await cargarTickets();
    }
    
    iniciar();
</script>
</body>
</html>
